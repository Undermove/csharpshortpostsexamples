services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ratelimit
      MYSQL_DATABASE: ratelimit
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  # Два инстанса приложения — имитация нескольких подов в кубере
  app1:
    build: .
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MySQL=Server=mysql;Database=ratelimit;User=root;Password=ratelimit
    depends_on:
      mysql:
        condition: service_healthy

  app2:
    build: .
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MySQL=Server=mysql;Database=ratelimit;User=root;Password=ratelimit
    depends_on:
      mysql:
        condition: service_healthy
